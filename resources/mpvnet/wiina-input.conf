# Wiina 1.3.0 — mpv.net 键位表（wiina-input.conf）
#
# 与 Wiina 默认键位一一对应。放在 mpv.conf 同目录，wiina.conf 会通过
#   input-conf=~~/wiina-input.conf
# 自动加载。
#
# 注意：
#   * video-panel / audio-panel / sub-panel / playlist-panel / chapter-panel
#     是 Wiina 侧边栏命令，stock mpv / mpv.net 没有对应面板，故以注释保留；
#     如需在 mpv.net 里用，请改成 mpv.net 的脚本绑定或删除这五行。
#   * Wiina 里 Ctrl+t 切“窗口置顶”是应用层命令，mpv.net 的 ontop 用
#     `set ontop yes/no` 或 `cycle ontop`（已在下方保留 cycle ontop）。

# --- Wiina 侧边栏（仅 Wiina；mpv.net 无此面板）---
# Shift+Alt+v 快速video-panel
# Shift+Alt+a 快速audio-panel
# Shift+Alt+s 快速sub-panel
# Shift+Alt+p 快速playlist-panel
# Shift+Alt+c 快速chapter-panel

Ctrl+t cycle ontop
Ctrl+/ cycle mute

Ctrl+Alt+v cycle video
Ctrl+Alt+s cycle sub
Ctrl+Alt+a cycle audio

SPACE cycle pause
Ctrl+. stop

Ctrl+s screenshot

Ctrl+l ab-loop
Ctrl+L cycle-values loop "inf" "no"

Ctrl+RIGHT playlist-next
Ctrl+LEFT playlist-prev

Shift+Ctrl+> add chapter 1
Shift+Ctrl+< add chapter -1

Ctrl+[ multiply speed 0.5
Ctrl+] multiply speed 2.0
Alt+Ctrl+[ multiply speed 1/1.1
Alt+Ctrl+] multiply speed 1.1
Ctrl+\ set speed 1.0

Ctrl+0 set window-scale 0.5
Ctrl+1 set window-scale 1
Ctrl+2 set window-scale 2

RIGHT seek 5
LEFT seek -5
Alt+RIGHT frame-step
Alt+LEFT frame-back-step

Shift+LEFT sub-seek -1
Shift+RIGHT sub-seek 1

UP add volume 5
DOWN add volume -5
Alt+UP add volume 1
Alt+DOWN add volume -1

Shift+( add audio-delay 0.5
Shift+) add audio-delay -0.5
Alt+Shift+( add audio-delay 0.1
Alt+Shift+) add audio-delay -0.1
Shift+_ set audio-delay 0

Z add sub-delay -0.5
X add sub-delay 0.5
Alt+Z add sub-delay -0.1
Alt+X add sub-delay 0.1
C set sub-delay 0

ESC set fullscreen no
ENTER set fullscreen yes

# --- 常用补充键位（wiina.txt 中的 mpv 原生绑定）---
q quit
p cycle pause
. frame-step
, frame-back-step
o show-progress
P show-progress
m cycle mute

Shift+PGUP seek 600
Shift+PGDWN seek -600

G add sub-scale +0.1
F add sub-scale -0.1

r add sub-pos -1
R add sub-pos +1
t add sub-pos +1
v cycle sub-visibility
Alt+v cycle secondary-sub-visibility

f cycle fullscreen

E cycle edition

POWER quit
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
PLAYONLY set pause no
PAUSEONLY set pause yes
STOP stop
FORWARD seek 15
REWIND seek -15
NEXT playlist-next
PREV playlist-prev
VOLUME_UP add volume 2
VOLUME_DOWN add volume -2
MUTE cycle mute
CLOSE_WIN quit
