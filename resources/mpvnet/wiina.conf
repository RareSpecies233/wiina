# Wiina 1.3.0 — mpv.net 兼容配置（wiina.conf）
#
# 用法（二选一）：
#   便携版：把本文件放到 mpvnet.exe 同级的 config 目录（config/mpv.conf），
#           并把 wiina-input.conf 放在同一目录。
#   安装版：放到 %APPDATA%\mpv.net\mpv.conf，
#           wiina-input.conf 放到 %APPDATA%\mpv.net\wiina-input.conf。
#
# 说明：mpv.net 的 mpv.conf 只接受“选项”，键位绑定必须放在 input.conf 里。
# 因此本配置通过 input-conf 指向同目录的 wiina-input.conf。
# 若你已有自己的 mpv.conf，可只把 [wiina] 段和 profile=wiina 两行合并进去。

profile=wiina

[wiina]
# --- 渲染：与 Wiina 的 D3D11 路径保持一致（但不使用 WinUI 专用的 composition 输出） ---
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=auto-safe

# --- 播放行为 ---
keep-open=yes
hr-seek=yes
save-position-on-quit=yes
watch-later-options=start
resume-playback=yes

# --- 画质：Wiina“默认”预设（mpv 原生默认的显式写法） ---
scale=lanczos
dscale=hermite
cscale=bilinear
scale-antiring=0
dscale-antiring=0
cscale-antiring=0
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
dither=fruit
dither-depth=auto
dither-size-fruit=6
temporal-dither=no
interpolation=no
tscale=oversample
video-sync=audio
video-sync-max-video-change=1.0
scaler-resizes-only=yes

# --- 去色带：Wiina 默认关闭；需要时把 deband 改为 yes ---
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32

# --- 字幕与截图 ---
sub-visibility=yes
sub-auto=fuzzy
screenshot-format=png
screenshot-high-bit-depth=yes

# --- OSD / OSC：由 mpv.net 自带界面负责 ---
osd-level=1
osd-duration=2000

# --- 键位：加载 Wiina 默认键位表 ---
input-default-bindings=no
input-conf=~~/wiina-input.conf
