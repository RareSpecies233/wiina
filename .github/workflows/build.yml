name: build

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Wiina.slnx

      - name: Build
        run: dotnet build Wiina.slnx -c Release --no-restore

      # Tests are added in Stage 3; keep the workflow green until then.
